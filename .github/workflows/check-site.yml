name: Check site

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check public links and anchors
        run: python3 scripts/check_site.py

      - name: Check JavaScript syntax
        run: find . -path ./.git -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test Moscow streets trainer
        run: node --test brain/map_msk/tests/*.test.js

      - name: Test interactive Euler articles
        run: node --test euler/*/tests/*.test.js

      - name: Test Algorithmic Atlas
        run: node --test algorithmic_atlas/tests/*.test.js

      - name: Validate Moscow streets dataset
        run: python3 brain/map_msk/tools/build_cao_map.py --validate-only brain/map_msk/data/cao-map.json
