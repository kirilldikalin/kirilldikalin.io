<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Таблица значений суммы делителей произведения для N равного 3</title>
  <desc id="desc">Матрица три на три со значениями 1, 3, 4; 3, 7, 12; 4, 12, 13. Сумма всех ячеек равна 59.</desc>
  <rect width="760" height="430" rx="18" fill="#fafafa"/>
  <text x="380" y="48" text-anchor="middle" font-family="monospace" font-size="24" fill="#303033">σ(i·j), N = 3</text>
  <g transform="translate(190 82)" font-family="monospace" text-anchor="middle">
    <text x="-55" y="55" font-size="19" fill="#66666c">i \ j</text>
    <g font-size="21" fill="#303033">
      <text x="60" y="0">1</text>
      <text x="180" y="0">2</text>
      <text x="300" y="0">3</text>
      <text x="-55" y="82">1</text>
      <text x="-55" y="182">2</text>
      <text x="-55" y="282">3</text>
    </g>
    <g stroke="#bfc0c5" stroke-width="2">
      <rect x="0" y="25" width="120" height="100" rx="8" fill="#fff"/>
      <rect x="120" y="25" width="120" height="100" rx="8" fill="#fff"/>
      <rect x="240" y="25" width="120" height="100" rx="8" fill="#fff"/>
      <rect x="0" y="125" width="120" height="100" rx="8" fill="#fff"/>
      <rect x="120" y="125" width="120" height="100" rx="8" fill="#f2f2f3"/>
      <rect x="240" y="125" width="120" height="100" rx="8" fill="#fff"/>
      <rect x="0" y="225" width="120" height="100" rx="8" fill="#fff"/>
      <rect x="120" y="225" width="120" height="100" rx="8" fill="#fff"/>
      <rect x="240" y="225" width="120" height="100" rx="8" fill="#f2f2f3"/>
    </g>
    <g font-size="28" fill="#303033">
      <text x="60" y="88">1</text>
      <text x="180" y="88">3</text>
      <text x="300" y="88">4</text>
      <text x="60" y="188">3</text>
      <text x="180" y="188">7</text>
      <text x="300" y="188">12</text>
      <text x="60" y="288">4</text>
      <text x="180" y="288">12</text>
      <text x="300" y="288">13</text>
    </g>
  </g>
  <path d="M585 135 C650 165 650 255 585 285" fill="none" stroke="#a63f36" stroke-width="3"/>
  <path d="M585 135 l-13 5 l9 10" fill="none" stroke="#a63f36" stroke-width="3"/>
  <text x="635" y="202" text-anchor="middle" font-family="monospace" font-size="18" fill="#a63f36">все 9</text>
  <text x="635" y="229" text-anchor="middle" font-family="monospace" font-size="18" fill="#a63f36">ячеек</text>
  <text x="380" y="402" text-anchor="middle" font-family="monospace" font-size="24" fill="#303033">S(3) = 1+3+4+3+7+12+4+12+13 = 59</text>
</svg>
