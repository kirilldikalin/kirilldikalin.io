<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Плато функции целой части от двадцати, делённого на d</title>
  <desc id="desc">Ступенчатый график показывает, что значения floor(20/d) постоянны на целых блоках и длинные плато появляются при малых частных.</desc>
  <rect width="900" height="430" rx="18" fill="#fafafa"/>
  <text x="450" y="48" text-anchor="middle" font-family="monospace" font-size="24" fill="#303033">q(d) = ⌊20 / d⌋</text>
  <g transform="translate(75 70)">
    <line x1="0" y1="300" x2="770" y2="300" stroke="#77777d" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#77777d" stroke-width="2"/>
    <g stroke="#d6d6da" stroke-width="1">
      <line x1="0" y1="0" x2="770" y2="0"/>
      <line x1="0" y1="150" x2="770" y2="150"/>
      <line x1="0" y1="225" x2="770" y2="225"/>
      <line x1="0" y1="270" x2="770" y2="270"/>
    </g>
    <path d="M0 0 H38 V150 H76 V200 H114 V225 H152 V240 H228 V255 H380 V270 H760 V285"
          fill="none" stroke="#303033" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#303033" font-family="monospace" font-size="17" text-anchor="middle">
      <text x="19" y="-10">20</text>
      <text x="57" y="140">10</text>
      <text x="95" y="190">6</text>
      <text x="133" y="215">5</text>
      <text x="190" y="230">4</text>
      <text x="304" y="245">2</text>
      <text x="570" y="260">1</text>
    </g>
    <g fill="#66666c" font-family="monospace" font-size="16" text-anchor="middle">
      <text x="19" y="326">1</text>
      <text x="57" y="326">2</text>
      <text x="95" y="326">3</text>
      <text x="133" y="326">4</text>
      <text x="190" y="326">5–6</text>
      <text x="304" y="326">7–10</text>
      <text x="570" y="326">11–20</text>
    </g>
    <text x="385" y="360" text-anchor="middle" font-family="monospace" font-size="18" fill="#303033">блок [l,r] заканчивается в r = ⌊20 / q⌋</text>
  </g>
</svg>
